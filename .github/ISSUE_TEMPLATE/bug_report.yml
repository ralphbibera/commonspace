name: Bug report
description: Report a reproducible problem in Commonspace.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues before reporting a new problem. Use synthetic examples and remove private data from logs and screenshots.
        For suspected security problems, follow SECURITY.md and report privately.
  - type: textarea
    id: summary
    attributes:
      label: What went wrong?
      description: Describe what happened and what you expected instead.
      placeholder: Describe the problem in the app.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Give the shortest sequence that makes the problem happen.
      placeholder: |
        1. Start Commonspace with ...
        2. Open ...
        3. Select ...
        4. The app ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commonspace version
      description: Give the release version or Git commit. From an extracted archive, run node commonspace.mjs --version.
      placeholder: A release version or Git commit
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Where does the problem happen?
      options:
        - App interface
        - Storybook
        - API or server
        - Agent selection or shared context
        - Agent connection or conversation session
        - Saving data or upgrading
        - Installation or background service
        - Other
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows
        - Other
    validations:
      required: true
  - type: textarea
    id: installation
    attributes:
      label: How are you running Commonspace?
      description: State whether you use the npm package or a source checkout, a terminal or background service, your Node.js version, and your CPU architecture. Leave out private paths.
      placeholder: npm package, macOS background service, Node.js 22, arm64
  - type: textarea
    id: logs
    attributes:
      label: Relevant output or screenshots
      description: Include only what helps explain the problem. Remove secrets, local paths, agent session identifiers, and private conversation content.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and found no duplicate.
          required: true
        - label: I removed private data from this report.
          required: true
