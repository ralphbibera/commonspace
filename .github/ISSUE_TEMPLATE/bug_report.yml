name: Bug report
description: Report a reproducible problem in Commonspace.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first. Remove private paths, credentials, and native session details from the report.
  - type: textarea
    id: summary
    attributes:
      label: Problem
      description: What happened, and what did you expect to happen?
      placeholder: Describe the observed and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Give the smallest sequence that reproduces the problem.
      placeholder: |
        1. Start Commonspace with ...
        2. Open ...
        3. Select ...
        4. Observe ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Revision or version
      description: Provide a public release, commit, or branch name.
      placeholder: main or a public commit
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - UI
        - Storybook
        - API or server
        - Routing or context
        - Agent session or ACP
        - Persistence or migration
        - Installation or service
        - Other
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS
        - Linux
        - Windows
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Include sanitized error output or screenshots. Do not include secrets, local paths, or native session identifiers.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and found no duplicate.
          required: true
        - label: I removed private data from this report.
          required: true
