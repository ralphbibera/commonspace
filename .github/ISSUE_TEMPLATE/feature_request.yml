name: Feature request
description: Suggest an improvement to Commonspace.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Start with the problem you want to solve. Commonspace helps people work with agents through conversations, projects, and shared context.
        For a larger change, agree on the approach with a maintainer before implementing it.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Explain who needs this change and what is difficult or missing today.
      placeholder: Describe the problem from the user's point of view.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help?
      description: Describe the smallest change that would solve the problem.
      placeholder: Explain what the user would see or do.
    validations:
      required: true
  - type: textarea
    id: product_fit
    attributes:
      label: Where does this fit in Commonspace?
      description: Identify the part of the existing workspace that should change.
      placeholder: For example, a Project, Channel, Direct Message, Agent, Message, thread, or shared context.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and limits
      description: Describe other approaches you considered and what this change should leave out.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and pull requests.
          required: true
        - label: I checked this proposal against Commonspace's product direction.
          required: true
