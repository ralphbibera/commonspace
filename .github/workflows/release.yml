name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish (for example, v0.0.1).
        required: true
        type: string
      dry_run:
        description: Verify package without publishing it.
        required: true
        default: true
        type: boolean

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
      sha: ${{ steps.version.outputs.sha }}
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Require workflow dispatch from main
        env:
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          if [[ "$WORKFLOW_REF" != "refs/heads/main" ]]; then
            echo "::error::Run the release workflow from main."
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Require exact tag and package version
        id: version
        run: |
          node scripts/package-npm.mjs --check-tag "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Release tag must point to a commit on main."
            exit 1
          fi
          printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Require publication to be explicitly enabled
        if: ${{ ! inputs.dry_run }}
        env:
          NPM_RELEASE_ENABLED: ${{ vars.NPM_RELEASE_ENABLED }}
        run: |
          if [[ "$NPM_RELEASE_ENABLED" != "true" ]]; then
            echo "::error::Set NPM_RELEASE_ENABLED=true only after npm package ownership and trusted publishing are configured."
            exit 1
          fi

  verify:
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm verify:live:built
      - run: pnpm package:npm
      - run: pnpm verify:npm-package
      - name: Preview npm publish
        if: inputs.dry_run
        run: npm publish artifacts/npm/*.tgz --dry-run
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: commonspace-npm-package
          path: artifacts/npm/*.tgz
          if-no-files-found: error
          retention-days: 1

  publish:
    if: ${{ ! inputs.dry_run && github.repository == 'ralphbibera/commonspace' }}
    needs: [resolve, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm-release
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_PRERELEASE: ${{ needs.resolve.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: commonspace-npm-package
          path: artifacts/npm
      - name: Require unchanged release tag
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          current_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/refs%2Ftags%2F$RELEASE_TAG" --jq .sha)"
          if [[ "$current_sha" != "$SOURCE_SHA" ]]; then
            echo "::error::Release tag moved after verification. Refusing to publish."
            exit 1
          fi
      - name: Publish npm package
        run: |
          dist_tag=latest
          if [[ "$RELEASE_PRERELEASE" == "true" ]]; then
            dist_tag=next
          fi
          npm publish artifacts/npm/*.tgz --access public --provenance --tag "$dist_tag"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "${{ needs.resolve.outputs.sha }}" \
            --verify-tag \
            --prerelease="$RELEASE_PRERELEASE" \
            --title "Commonspace $RELEASE_TAG" \
            --generate-notes
