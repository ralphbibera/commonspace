name: Draft release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to verify and package (for example, v0.0.1).
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Require a version tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Choose an existing version tag such as v0.0.1."
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Require exact tag and package version
        id: version
        run: |
          node scripts/package-release.mjs --check-tag "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          printf 'tag=%s\n' "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  verify:
    needs: resolve
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}

  package:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x64
          - runner: macos-15
            target: darwin-arm64
          - runner: macos-15-intel
            target: darwin-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
      SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
      RELEASE_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify macOS service lifecycle contracts
        if: runner.os == 'macOS'
        run: pnpm test -- tests/service-manager.spec.mjs
      - run: pnpm release:pack
      - name: Require clean package provenance
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { execFileSync } from "node:child_process";

          const version = process.env.RELEASE_TAG.slice(1);
          const name = `commonspace-${version}-${process.env.RELEASE_TARGET}`;
          const metadata = JSON.parse(execFileSync("tar", [
            "-xOf", `artifacts/release/${name}.tar.gz`,
            `${name}/commonspace-release.json`,
          ], { encoding: "utf8" }));
          assert.equal(metadata.version, version);
          assert.equal(metadata.revision, process.env.SOURCE_SHA);
          assert.equal(metadata.dirty, false);
          assert.equal(metadata.platform, process.platform);
          assert.equal(metadata.arch, process.arch);
          assert.equal(metadata.distribution, "archive");
          NODE
      - run: pnpm verify:release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: commonspace-${{ matrix.target }}
          path: |
            artifacts/release/commonspace-*.tar.gz
            artifacts/release/commonspace-*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  draft:
    needs: [resolve, verify, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
      SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
      RELEASE_PRERELEASE: ${{ needs.resolve.outputs.prerelease }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: commonspace-*
          merge-multiple: true
          path: artifacts/release
      - name: Verify all platform checksums
        working-directory: artifacts/release
        run: |
          for target in linux-x64 darwin-arm64 darwin-x64; do
            archive="commonspace-${RELEASE_TAG#v}-$target.tar.gz"
            test -f "$archive"
            sha256sum --check "$archive.sha256"
          done
      - name: Create a draft release
        working-directory: artifacts/release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/refs%2Ftags%2F$RELEASE_TAG" --jq .sha)"
          if [[ "$current_sha" != "$SOURCE_SHA" ]]; then
            echo "::error::The release tag moved after verification. Refusing to create a release."
            exit 1
          fi
          existing_tags="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name')"
          while IFS= read -r existing_tag; do
            if [[ "$existing_tag" == "$RELEASE_TAG" ]]; then
              echo "::error::A release already exists for this tag. Review it manually; this workflow never overwrites releases."
              exit 1
            fi
          done <<< "$existing_tags"
          assets=()
          for target in linux-x64 darwin-arm64 darwin-x64; do
            archive="commonspace-${RELEASE_TAG#v}-$target.tar.gz"
            assets+=("$archive" "$archive.sha256")
          done
          gh release create "$RELEASE_TAG" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --verify-tag \
            --draft \
            --prerelease="$RELEASE_PRERELEASE" \
            --latest=false \
            --title "Commonspace $RELEASE_TAG" \
            --generate-notes
