name: Apply settings review fixes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Restore and correct migration
        run: |
          git show be8dbce9865b935f3f62cab0c4f435aa46d03795:scripts/apply-settings-review-fixes.mjs > scripts/apply-settings-review-fixes.mjs
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'scripts/apply-settings-review-fixes.mjs';
          let migration = fs.readFileSync(path, 'utf8');

          const pinStart = migration.indexOf('\tconst pinFunctions = /');
          const pinEnd = migration.indexOf('\n\n\tsource = replaceExactly(', pinStart);
          if (pinStart < 0 || pinEnd < 0 || pinEnd <= pinStart) {
            throw new Error('Could not locate old fake-pin cleanup block');
          }
          const pinReplacement = `\tconst pinStart = source.indexOf("\\n\\tconst collectionPinned = (");
          \tconst pinEnd = source.indexOf("\\n\\n\\tif (!wide) {", pinStart);
          \tif (pinStart < 0 || pinEnd < 0) throw new Error("Missing fake pin helper block");
          \tsource = source.slice(0, pinStart) + source.slice(pinEnd);
          \tconst pinLines = source.split("\\n");
          \tconst cleanedPinLines = [];
          \tfor (let index = 0; index < pinLines.length; index += 1) {
          \t\tconst line = pinLines[index];
          \t\tif (line.includes("pinned={collectionPinned(")) continue;
          \t\tif (
          \t\t\tline.includes("onTogglePinned={() => {") &&
          \t\t\tpinLines[index + 1]?.includes("toggleCollectionPinned(")
          \t\t) {
          \t\t\tindex += 2;
          \t\t\tcontinue;
          \t\t}
          \t\tcleanedPinLines.push(line);
          \t}
          \tsource = cleanedPinLines.join("\\n");
          \tif (source.includes("collectionPinned(") || source.includes("toggleCollectionPinned("))
          \t\tthrow new Error("Fake pin references remain");`;
          migration = migration.slice(0, pinStart) + pinReplacement + migration.slice(pinEnd);

          function replaceCall(label, replacement) {
            const labelIndex = migration.indexOf(`"${label}"`);
            if (labelIndex < 0) throw new Error(`Missing migration label: ${label}`);
            const start = migration.lastIndexOf('\tsource = replaceExactly(', labelIndex);
            const endMarker = migration.indexOf('\n\t);', labelIndex);
            if (start < 0 || endMarker < 0) throw new Error(`Could not isolate migration call: ${label}`);
            migration = migration.slice(0, start) + replacement + migration.slice(endMarker + 4);
          }

          replaceCall(
            'non-misleading saved settings badge',
            `\tconst configuredLabel = "Configured";
          \tconst configuredIndex = source.indexOf(configuredLabel);
          \tif (configuredIndex < 0) throw new Error("Missing configured settings badge");
          \tsource = source.slice(0, configuredIndex) + "Saved configuration" + source.slice(configuredIndex + configuredLabel.length);
          \tconst successDotClass = 'className="size-[7px] rounded-full bg-[var(--status-success)]"';
          \tconst successDotIndex = source.lastIndexOf(successDotClass, configuredIndex);
          \tif (successDotIndex < 0) throw new Error("Missing settings badge status dot");
          \tsource = source.slice(0, successDotIndex) + 'className="size-[7px] rounded-full bg-muted-foreground"' + source.slice(successDotIndex + successDotClass.length);`,
          );

          replaceCall(
            'truthful validation status styling',
            `\tconst oldStatusClass = 'className="mt-3 inline-flex items-center gap-2 text-xs text-[var(--status-success)]"';
          \tconst statusClassIndex = source.indexOf(oldStatusClass);
          \tif (statusClassIndex < 0) throw new Error("Missing inference status class");
          \tconst newStatusClass = 'className={cn("mt-3 inline-flex items-center gap-2 text-xs", inferenceCheckOk === true ? "text-[var(--status-success)]" : inferenceCheckOk === false ? "text-destructive" : "text-muted-foreground")}';
          \tsource = source.slice(0, statusClassIndex) + newStatusClass + source.slice(statusClassIndex + oldStatusClass.length);
          \tconst oldStatusIcon = '<span aria-hidden="true">✓</span>';
          \tconst statusIconIndex = source.indexOf(oldStatusIcon, statusClassIndex);
          \tif (statusIconIndex < 0) throw new Error("Missing inference status icon");
          \tconst newStatusIcon = '<span aria-hidden="true">{inferenceCheckOk === true ? "✓" : inferenceCheckOk === false ? "!" : "…"}</span>';
          \tsource = source.slice(0, statusIconIndex) + newStatusIcon + source.slice(statusIconIndex + oldStatusIcon.length);`,
          );

          fs.writeFileSync(path, migration);
          NODE
          node --check scripts/apply-settings-review-fixes.mjs
          node scripts/apply-settings-review-fixes.mjs
      - name: Preserve legacy store compatibility
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'ui/src/CommonspaceSidebar.tsx';
          let source = fs.readFileSync(path, 'utf8');

          const saveStart = source.indexOf('\tconst saveDefaults = async (event: FormEvent) => {');
          const saveEnd = source.indexOf('\n\t};', saveStart);
          if (saveStart < 0 || saveEnd < 0) throw new Error('Missing saveDefaults function');
          const saveReplacement = [
            '\tconst saveDefaults = async (event: FormEvent) => {',
            '\t\tevent.preventDefault();',
            '\t\tconst request = {',
            '\t\t\trouting: routingUpdateRequest(),',
            '\t\t\tdefaults: {',
            '\t\t\t\tmodel: defaultModel || null,',
            '\t\t\t\treasoning: defaultReasoning,',
            '\t\t\t\tmaxAgentsPerTurn: defaultMaxAgents,',
            '\t\t\t\tmemoryThreads: defaultMemoryThreads,',
            '\t\t\t},',
            '\t\t};',
            '\t\tif (typeof store.updateWorkspaceSettings === "function") {',
            '\t\t\tawait store.updateWorkspaceSettings(request);',
            '\t\t} else {',
            '\t\t\tawait store.updateRoutingConfiguration(request.routing);',
            '\t\t\tawait store.mutate({ action: "set-defaults", ...request.defaults });',
            '\t\t}',
            '\t\tsetSettingsOpen(false);',
            '\t};',
          ].join('\n');
          source = source.slice(0, saveStart) + saveReplacement + source.slice(saveEnd + 4);

          const checkStart = source.indexOf('\tconst checkInferenceConfiguration = async () => {');
          const checkEnd = source.indexOf('\n\t};', checkStart);
          if (checkStart < 0 || checkEnd < 0) throw new Error('Missing inference check function');
          const checkReplacement = [
            '\tconst checkInferenceConfiguration = async () => {',
            '\t\tif (inferenceChecking) return;',
            '\t\tsetInferenceChecking(true);',
            '\t\tsetInferenceCheckOk(null);',
            '\t\tsetInferenceCheckStatus("Checking unsaved configuration…");',
            '\t\ttry {',
            '\t\t\tconst result =',
            '\t\t\t\ttypeof store.validateRoutingConfiguration === "function"',
            '\t\t\t\t\t? await store.validateRoutingConfiguration(routingUpdateRequest())',
            '\t\t\t\t\t: (await store.diagnostics()).inference;',
            '\t\t\tsetInferenceCheckOk(result.configured);',
            '\t\t\tsetInferenceCheckStatus(',
            '\t\t\t\tresult.configured',
            '\t\t\t\t\t? `Configuration verified · ${result.provider}`',
            '\t\t\t\t\t: "Configuration needs attention",',
            '\t\t\t);',
            '\t\t} catch {',
            '\t\t\tsetInferenceCheckOk(false);',
            '\t\t\tsetInferenceCheckStatus("Configuration check failed");',
            '\t\t} finally {',
            '\t\t\tsetInferenceChecking(false);',
            '\t\t}',
            '\t};',
          ].join('\n');
          source = source.slice(0, checkStart) + checkReplacement + source.slice(checkEnd + 4);
          fs.writeFileSync(path, source);
          NODE
      - name: Update Storybook store fixture
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'ui/src/storybook-fixtures.ts';
          let source = fs.readFileSync(path, 'utf8');
          const target = '\t\tupdateRoutingConfiguration: async () => undefined,\n';
          if (!source.includes(target)) throw new Error('Missing Storybook routing fixture target');
          source = source.replace(
            target,
            `${target}\t\tvalidateRoutingConfiguration: async () => ({\n\t\t\tprovider: "openai-compatible",\n\t\t\tlocation: "remote",\n\t\t\tconfigured: true,\n\t\t\tsends: [],\n\t\t}),\n\t\tupdateWorkspaceSettings: async () => undefined,\n`,
          );
          fs.writeFileSync(path, source);
          NODE
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm check
      - name: Commit verified fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix: make workspace settings truthful and transactional"
          git push origin HEAD:main
