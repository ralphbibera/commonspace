name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm build:storybook

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  browser:
    runs-on: ubuntu-latest
    env:
      COMMONSPACE_USE_SYSTEM_CHROME: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify system Chrome
        run: google-chrome --version
      - run: pnpm test:storybook
      - run: pnpm build
      - run: pnpm verify:live:built

  check:
    if: always()
    needs: [static, unit, browser]
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI gate
        env:
          STATIC_RESULT: ${{ needs.static.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          test "$STATIC_RESULT" = "success"
          test "$UNIT_RESULT" = "success"
          test "$BROWSER_RESULT" = "success"
