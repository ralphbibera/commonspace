name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Pack installable Commonspace plugin
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm_config_ignore_scripts=true pnpm pack --out commonspace.tgz
      - name: Upload installable plugin
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: commonspace-plugin-${{ github.sha }}
          path: commonspace.tgz
          if-no-files-found: error
          retention-days: 14
