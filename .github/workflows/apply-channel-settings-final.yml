name: Finalize atomic channel settings

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Apply source changes and update legacy assertion
        run: |
          git show 6a1bfd5b6ddef320c94615fd79585ac664e961d4:.github/workflows/apply-channel-settings-transaction.yml > /tmp/channel-settings-source.yml
          node <<'EXTRACT'
          const fs = require("node:fs");
          const source = fs.readFileSync("/tmp/channel-settings-source.yml", "utf8");
          const startMarker = "          node <<'NODE'\n";
          const endMarker = "\n          NODE";
          const start = source.indexOf(startMarker);
          const end = source.indexOf(endMarker, start + startMarker.length);
          if (start < 0 || end < 0) throw new Error("Could not extract atomic channel settings script");
          const script = source
            .slice(start + startMarker.length, end)
            .split("\n")
            .map((line) => (line.startsWith("          ") ? line.slice(10) : line))
            .join("\n");
          fs.writeFileSync("/tmp/apply-channel-settings.cjs", script);
          EXTRACT
          node /tmp/apply-channel-settings.cjs
          node <<'PATCH'
          const fs = require("node:fs");
          const path = "tests/commonspace.client.spec.tsx";
          let source = fs.readFileSync(path, "utf8");
          const before = `\t\tawait waitFor(() => {
          \t\t\texpect(mutate).toHaveBeenCalledWith({
          \t\t\t\taction: "set-channel-memory",
          \t\t\t\tchannelId: "general",
          \t\t\t\tsummary: "Updated Channel summary.",
          \t\t\t\tdecisions: ["Decision one.", "Decision two."],
          \t\t\t\topenQuestions: ["Existing question?"],
          \t\t\t});
          \t\t});`;
          const after = `\t\tawait waitFor(() => {
          \t\t\texpect(mutate).toHaveBeenCalledTimes(1);
          \t\t\texpect(mutate).toHaveBeenCalledWith({
          \t\t\t\taction: "set-channel-configuration",
          \t\t\t\tchannelId: "general",
          \t\t\t\tagentIds: [],
          \t\t\t\tinstructions: "Keep work scoped.",
          \t\t\t\tmodel: null,
          \t\t\t\treasoning: null,
          \t\t\t\tsummary: "Updated Channel summary.",
          \t\t\t\tdecisions: ["Decision one.", "Decision two."],
          \t\t\t\topenQuestions: ["Existing question?"],
          \t\t\t});
          \t\t});`;
          const first = source.indexOf(before);
          if (first < 0) throw new Error("Missing legacy channel-context expectation");
          if (source.indexOf(before, first + before.length) >= 0) {
            throw new Error("Legacy channel-context expectation is not unique");
          }
          source = source.slice(0, first) + after + source.slice(first + before.length);
          fs.writeFileSync(path, source);
          PATCH
          rm -f .github/workflows/apply-channel-settings-final.yml
          test ! -e .github/workflows/apply-channel-settings-transaction.yml
          grep -q 'action: "set-channel-configuration"' packages/shared/src/contracts.ts
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm check
      - name: Commit verified source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix: save channel configuration atomically"
          git push origin HEAD:main
